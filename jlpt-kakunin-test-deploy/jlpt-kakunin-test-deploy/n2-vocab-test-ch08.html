hai":"ขอแสดงความเสียใจอย่างยิ่ง : เป็นสำนวนที่ใช้พูดกับผู้ป่วยหรือผู้ที่ประสบภัยพิบัติ","alternatives":[],"source":"補足","kind":"定型表現","collocations":["心よりお\u003cruby>見舞\u003crt>みま\u003c/rt>\u003c/ruby>い\u003cruby>申\u003crt>もう\u003c/rt>\u003c/ruby>し\u003cruby>上\u003crt>あ\u003c/rt>\u003c/ruby>げます","暑中お\u003cruby>見舞\u003crt>みま\u003c/rt>\u003c/ruby>い\u003cruby>申\u003crt>もう\u003c/rt>\u003c/ruby>し\u003cruby>上\u003crt>あ\u003c/rt>\u003c/ruby>げます","お\u003cruby>見舞\u003crt>みま\u003c/rt>\u003c/ruby>いの言葉"]},{"id":15,"before":"家の","after":"で学校を休んだ","answer":"事情","reading":"じじょう","thai":"สถานการณ์, สภาพการณ์","alternatives":[],"source":"教科書","kind":"コロケーション","collocations":["\u003cruby>事情\u003crt>じじょう\u003c/rt>\u003c/ruby>がある","\u003cruby>事情\u003crt>じじょう\u003c/rt>\u003c/ruby>を説明する","家の\u003cruby>事情\u003crt>じじょう\u003c/rt>\u003c/ruby>"]},{"id":16,"before":"歌の","after":"に出場する","answer":"コンテスト","reading":"コンテスト","thai":"การประกวด, การแข่งขัน","alternatives":[],"source":"補足","kind":"コロケーション","collocations":["コンテストに出る","コンテストで\u003cruby>優勝\u003crt>ゆうしょう\u003c/rt>\u003c/ruby>する","ダンスコンテスト"]},{"id":17,"before":"絵画展で","after":"する","answer":"入賞","reading":"にゅうしょう","thai":"การได้รับรางวัล","alternatives":[],"source":"補足","kind":"コロケーション","collocations":["コンテストで\u003cruby>入賞\u003crt>にゅうしょう\u003c/rt>\u003c/ruby>する","\u003cruby>入賞\u003crt>にゅうしょう\u003c/rt>\u003c/ruby>を\u003cruby>果\u003crt>は\u003c/rt>\u003c/ruby>たす","入賞者"]},{"id":18,"before":"歌手が","after":"を\u003cruby>発表\u003crt>はっぴょう\u003c/rt>\u003c/ruby>する","answer":"新曲","reading":"しんきょく","thai":"เพลงใหม่","alternatives":[],"source":"補足","kind":"コロケーション","collocations":["\u003cruby>新曲\u003crt>しんきょく\u003c/rt>\u003c/ruby>を\u003cruby>発表\u003crt>はっぴょう\u003c/rt>\u003c/ruby>する","\u003cruby>新曲\u003crt>しんきょく\u003c/rt>\u003c/ruby>を出す","\u003cruby>新曲\u003crt>しんきょく\u003c/rt>\u003c/ruby>が\u003cruby>発売\u003crt>はつばい\u003c/rt>\u003c/ruby>される"]},{"id":19,"before":"","after":"また会いましょう","answer":"近いうち","reading":"ちかいうち","thai":"ในไม่ช้า, เร็ว ๆ นี้","alternatives":[],"source":"補足","kind":"コロケーション","collocations":["近いうちに会う","近いうちに\u003cruby>連絡\u003crt>れんらく\u003c/rt>\u003c/ruby>する","近いうちにお\u003cruby>伺\u003crt>うかが\u003c/rt>\u003c/ruby>いします"]},{"id":20,"before":"案を前向きに","after":"します","answer":"検討","reading":"けんとう","thai":"การพิจารณา","alternatives":[],"source":"補足","kind":"コロケーション","collocations":["前向きに\u003cruby>検討\u003crt>けんとう\u003c/rt>\u003c/ruby>する","案を\u003cruby>検討\u003crt>けんとう\u003c/rt>\u003c/ruby>する","\u003cruby>検討\u003crt>けんとう\u003c/rt>\u003c/ruby>を\u003cruby>重\u003crt>かさ\u003c/rt>\u003c/ruby>ねる"]},{"id":21,"before":"","after":"な\u003cruby>体験\u003crt>たいけん\u003c/rt>\u003c/ruby>をする","answer":"貴重","reading":"きちょうな","thai":"ล้ำค่า, มีคุณค่า","alternatives":[],"source":"補足","kind":"コロケーション","collocations":["\u003cruby>貴重\u003crt>きちょう\u003c/rt>\u003c/ruby>な\u003cruby>体験\u003crt>たいけん\u003c/rt>\u003c/ruby>","\u003cruby>貴重\u003crt>きちょう\u003c/rt>\u003c/ruby>な\u003cruby>資料\u003crt>しりょう\u003c/rt>\u003c/ruby>","\u003cruby>貴重\u003crt>きちょう\u003c/rt>\u003c/ruby>な意見"]},{"id":22,"before":"当選者は","after":"で決める","answer":"抽選","reading":"ちゅうせん","thai":"การจับสลาก","alternatives":[],"source":"補足","kind":"コロケーション","collocations":["\u003cruby>抽選\u003crt>ちゅうせん\u003c/rt>\u003c/ruby>で決める","\u003cruby>抽選\u003crt>ちゅうせん\u003c/rt>\u003c/ruby>に当たる","\u003cruby>抽選会\u003crt>ちゅうせんかい\u003c/rt>\u003c/ruby>"]}], CONFLICTS=[[11,12]];
const DRAW=10, STORE_KEY='tryn2-colloc2-deck-ch08';
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function conflicts(a,b){return CONFLICTS.some(p=>(p[0]===a&&p[1]===b)||(p[1]===a&&p[0]===b))}
function makeDeck(indices){for(let attempt=0;attempt<200;attempt++){let rest=shuffle(indices.slice()),out=[],ok=true;while(rest.length){let group=[],want=Math.min(DRAW,rest.length);for(let i=0;i<rest.length&&group.length<want;){if(group.some(j=>conflicts(rest[i],j))){i++;continue}group.push(rest.splice(i,1)[0])}if(group.length!==want){ok=false;break}out.push(...group)}if(ok)return out}return shuffle(indices.slice())}
function loadDeck(){try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(Array.isArray(d)&&d.every(i=>Number.isInteger(i)&&i>=0&&i<BANK.length))return [...new Set(d)]}catch(e){}return makeDeck(BANK.map((_,i)=>i))}
function saveDeck(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d))}catch(e){}}
function draw(){
  const all=BANK.map((_,i)=>i), deck=loadDeck(), picked=[];
  for(const i of deck) if(picked.length<DRAW&&!picked.some(j=>conflicts(i,j)))picked.push(i);
  const usedOutside=picked.length<DRAW;
  if(usedOutside) for(const i of shuffle(all.filter(i=>!deck.includes(i)))) if(picked.length<DRAW&&!picked.some(j=>conflicts(i,j)))picked.push(i);
  if(picked.length!==DRAW)throw Error('抽選できません');
  const remaining=deck.filter(i=>!picked.includes(i));
  saveDeck(usedOutside||remaining.length===0 ? makeDeck(all.filter(i=>!picked.includes(i))) : remaining);
  return shuffle(picked);
}
let current=[];
function render(){
  current=draw();
  qs('.questions').innerHTML=current.map((idx,n)=>{
    const q=BANK[idx]; const input=`（<input class="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第${n+1}問の答え">）`;
    return `<div class="question"><div class="q-text"><span class="q-num">${n+1}</span><span class="sentence">${q.before}${input}${q.after}</span></div><div class="hint" lang="th">〔${esc(q.thai)}〕</div><div class="explanation" aria-live="polite"></div></div>`;
  }).join('');
  qs('.print-key ol').innerHTML=current.map(idx=>{const q=BANK[idx];return `<li>${esc(q.answer)}${q.answer!==q.reading?`（${esc(q.reading)}）`:''}</li>`}).join('');
  qs('.score').textContent='　';
}
qs('.grade').addEventListener('click',()=>{let score=0;qsa('.question').forEach((row,n)=>{const item=BANK[current[n]],input=row.querySelector('.answer'),fb=row.querySelector('.explanation'),value=input.value.trim(),ok=[item.answer,item.reading,...item.alternatives].includes(value),half=ok&&/[一-龯々]/.test(item.answer)&&/^[ぁ-ゖー]+$/.test(value),cls=half?'half':ok?'correct':'wrong';score+=half?.5:ok?1:0;input.classList.remove('correct','half','wrong');input.classList.add(cls);fb.className='explanation show '+cls;fb.innerHTML=`<span class="mark">${half?'△ 0.5':ok?'○':'×'}</span>答え：<b>${esc(item.answer)}${item.answer!==item.reading?`（${esc(item.reading)}）`:''}</b>`+(item.alternatives.length?`<div class="meta">別解：${item.alternatives.map(esc).join('／')}</div>`:'')+`<div class="meta">関連：${item.collocations.join('／')}</div>`;});qs('.score').textContent=score;});
qs('.next').addEventListener('click',()=>{render();window.scrollTo(0,0)});render();
</script>
