  if(picked.length!==DRAW)throw Error('抽選できません');

  saveDeck(usedOutside||remaining.length===0 ? makeDeck(pool.filter(i=>!picked.includes(i))) : remaining);
  return shuffle(picked);
}
function label(r){return r.from===r.to?`p.${r.from}`:`p.${r.from}–${r.to}`}
function minTo(from){return MIN_TO.get(from)}
function validRange(from,to){return PAGES.includes(from)&&PAGES.includes(to)&&from<=to&&minTo(from)!==undefined&&to>=minTo(from)}
function message(from,to){
  const n=BANK.filter(q=>q.page>=from&&q.page<=to).length;
  const m=minTo(from);
  if(m!==undefined)return `${label({from,to})} は問題が${n}問しかないため10問のテストを作れません。終わりのページを p.${m} 以降にしてください。`;
  const back=[...MIN_TO].filter(([f,t])=>f<from&&t<=to).map(([f])=>f).pop();
  return `${label({from,to})} では10問のテストを作れません。`+(back!==undefined?`始めのページを p.${back} 以前にしてください。`:'範囲を広げてください。');
}
function fillTo(){
  const from=+qs('.from').value, sel=qs('.to'), prev=+sel.value, m=minTo(from);
  sel.innerHTML=PAGES.filter(p=>p>=from).map(p=>`<option value="${p}"${m===undefined||p<m?' disabled':''}>p.${p}</option>`).join('');
  const ok=PAGES.filter(p=>p>=from&&m!==undefined&&p>=m);
  sel.value=ok.includes(prev)?prev:(ok[0]??from);
  qs('.start').disabled=!ok.length;
  qs('.range-msg').textContent=ok.length?'':message(from,PAGES[PAGES.length-1]);
}
function start(from,to,push){
  if(!validRange(from,to)){qs('.range-msg').textContent=message(from,to);return false}
  range={from,to};
  pool=BANK.map((q,i)=>i).filter(i=>BANK[i].page>=from&&BANK[i].page<=to);
  qs('.range-msg').textContent='';
  qs('header h1').textContent=`${LEVEL} 単語テスト ${label(range)}`;
  document.title=`JLPT ${LEVEL} 単語テスト ${label(range)}`;
  if(push){try{history.replaceState(null,'',`?from=${from}&to=${to}`)}catch(e){}}
  qs('.test-box').hidden=false;
  render();
  return true;
}
function render(){
  current=draw();
  qs('.questions').innerHTML=current.map((idx,n)=>{
    const q=BANK[idx]; const input=`（<input class="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第${n+1}問の答え">）`;
    return `<div class="question"><div class="q-text"><span class="q-num">${n+1}</span><span class="sentence">${q.before}${input}${q.after}</span></div><div class="hint" lang="th">〔${esc(q.thai)}〕</div><div class="explanation" aria-live="polite"></div></div>`;
  }).join('');
  qs('.print-key ol').innerHTML=current.map(idx=>{const q=BANK[idx];return `<li>${esc(q.answer)}${q.answer!==q.reading?`（${esc(q.reading)}）`:''}</li>`}).join('');
  qs('.score').textContent='　';
}
qs('.grade').addEventListener('click',()=>{if(!range)return;let score=0;qsa('.question').forEach((row,n)=>{const item=BANK[current[n]],input=row.querySelector('.answer'),fb=row.querySelector('.explanation'),value=input.value.trim(),ok=[item.answer,item.reading,...item.alternatives].includes(value);if(ok)score++;input.classList.remove('correct','half','wrong');input.classList.add(ok?'correct':'wrong');fb.className='explanation show '+(ok?'correct':'wrong');fb.innerHTML=`<span class="mark">${ok?'○':'×'}</span>答え：<b>${esc(item.answer)}${item.answer!==item.reading?`（${esc(item.reading)}）`:''}</b>`+(item.alternatives.length?`<div class="meta">別解：${item.alternatives.map(esc).join('／')}</div>`:'')+`<div class="meta">関連：${item.collocations.join('／')}</div>`;});qs('.score').textContent=score;});
qs('.next').addEventListener('click',()=>{if(!range)return;render();window.scrollTo(0,0)});
qs('.from').innerHTML=PAGES.map(p=>`<option value="${p}">p.${p}</option>`).join('');
qs('.from').addEventListener('change',fillTo);
qs('.to').addEventListener('change',()=>{qs('.range-msg').textContent=''});
qs('.start').addEventListener('click',()=>start(+qs('.from').value,+qs('.to').value,true));
(function init(){
  const u=new URLSearchParams(location.search), f=parseInt(u.get('from'),10), t=parseInt(u.get('to')??u.get('from'),10);
  if(PAGES.includes(f)){qs('.from').value=f;fillTo();if(PAGES.includes(t)&&t>=f){qs('.to').value=t;start(f,t,false)}}else{qs('.from').value=PAGES[0];fillTo()}
})();
</script>
</body></html>
