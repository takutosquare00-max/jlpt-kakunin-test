<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JLPT N2 単語テスト 第5課（コロケーション）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-size:135%}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP',Meiryo,sans-serif;background:#f0f4f8;color:#1a202c;line-height:1.7;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.container{max-width:1100px;margin:0 auto;padding:20px 5px}
header{background:linear-gradient(135deg,#e53e3e 0%,#c53030 100%);color:#fff;padding:12px 16px;border-radius:14px;margin-bottom:14px;position:sticky;top:8px;z-index:100;box-shadow:0 4px 15px rgba(229,62,62,.4)}
.head-row{display:flex;align-items:center;gap:10px}
header h1{flex:1;min-width:0;font-size:1.02em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-box{flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums}
.score{display:inline-block;min-width:2.2em;text-align:center;border-bottom:2px solid rgba(255,255,255,.7)}
.section{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.questions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 32px}
.question{padding:16px 0;border-bottom:1px solid #e2e8f0}
.q-text{display:flex;align-items:baseline;font-size:1.05em;font-weight:500}
.q-num{flex:0 0 28px;display:inline-block;background:#e53e3e;color:#fff;width:28px;height:28px;text-align:center;line-height:28px;border-radius:50%;font-size:.8em;font-weight:bold;margin-right:8px}
.sentence{flex:1;min-width:0;overflow-wrap:anywhere}
.answer{width:6.5em;max-width:55vw;border:0;border-bottom:2px solid #a0aec0;background:#f7fafc;padding:0 .3em;font:inherit;text-align:center;border-radius:4px 4px 0 0}
.answer:focus{outline:2px solid #feb2b2;background:#fff}
.answer.correct{border-color:#48bb78;background:#f0fff4;color:#276749}.answer.half{border-color:#ed8936;background:#fffaf0}.answer.wrong{border-color:#fc8181;background:#fff5f5;color:#9b2c2c}
.hint{color:#718096;font-size:.8em;margin:4px 0 0 36px;overflow-wrap:anywhere}
.explanation{display:none;margin:8px 0 0 36px;padding:8px 10px;background:#fffbeb;border-radius:8px;font-size:.8em;border-left:3px solid #f6ad55}
.explanation.show{display:block}
.explanation .mark{font-weight:700;margin-right:6px}.explanation.correct .mark{color:#2f855a}.explanation.half .mark{color:#c05621}.explanation.wrong .mark{color:#c53030}
.explanation .meta{color:#718096}
.actions{display:flex;gap:12px;margin-top:20px}
.actions button{flex:1;min-height:48px;padding:14px;border-radius:12px;font:inherit;font-size:1em;font-weight:bold;cursor:pointer;transition:transform .2s,box-shadow .2s;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn-submit{background:linear-gradient(135deg,#e53e3e 0%,#c53030 100%);color:#fff;border:none}
.btn-next{background:#fff;color:#c53030;border:2px solid #e53e3e}
.actions button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(229,62,62,.3)}
.print-key{display:none}
@media(max-width:700px){.questions{grid-template-columns:minmax(0,1fr)}.section{padding:16px}}
@media print{html{font-size:100%}body{background:#fff}.actions,.explanation{display:none!important}header{position:static;box-shadow:none;background:none;color:#000;border-bottom:2px solid #000;border-radius:0}.score{border-color:#000}.section{box-shadow:none;padding:0}.question{break-inside:avoid}.answer{background:none!important;border-bottom:1px solid #000;color:transparent}.q-num{background:none;color:#000;border:1px solid #000}.print-key{display:block;break-before:page}.print-key li{margin:4px 0 4px 1.5em}}
</style>
</head>
<body>
<div class="container">
<header><div class="head-row"><h1>N2 単語テスト 第5課</h1><div class="score-box">点数 <span class="score">　</span> / 10</div></div></header>
<div class="section">
<div class="questions"></div>
<div class="actions"><button type="button" class="btn-submit grade">採点</button><button type="button" class="btn-next next">新しい10問</button></div>
</div>
<section class="print-key"><h2>解答</h2><ol></ol></section>
</div>
<script>
const BANK=[{"id":1,"sentence":"卒業後の（　）が決まる","answer":"就職先","reading":"しゅうしょくさき","thai":"สถานที่ทำงาน, นายจ้าง","alternatives":[],"source":"教科書","collocations":["就職先が決まる","就職先を選ぶ","就職先を探す"]},{"id":2,"sentence":"新入社員を（　）募集する","answer":"若干名","reading":"じゃっかんめい","thai":"จำนวนคนน้อย","alternatives":[],"source":"教科書","collocations":["若干名募集","若干名を採用する","募集人数は若干名"]},{"id":3,"sentence":"この業界は（　）が少ない","answer":"求人","reading":"きゅうじん","thai":"การรับสมัครงาน, การรับสมัครพนักงาน","alternatives":[],"source":"教科書","collocations":["求人がある","求人が少ない","求人に応募する"]},{"id":4,"sentence":"応募書類に（　）を書く","answer":"自己PR","reading":"じこPR","thai":"การเขียนแนะนำตัวเองสั้น ๆ เวลาสมัครงาน","alternatives":[],"source":"教科書","collocations":["自己PRを書く","自己PRを考える","自己PRをまとめる"]},{"id":5,"sentence":"自宅で（　）を使って運動する","answer":"健康器具","reading":"けんこうきぐ","thai":"อุปกรณ์ออกกำลังกาย","alternatives":[],"source":"教科書","collocations":["健康器具を使う","健康器具を買う","家庭用健康器具"]},{"id":6,"sentence":"祖父は病気で（　）になった","answer":"寝たきり","reading":"ねたきり","thai":"นอนนิ่ง ๆ, นอนเฉย ๆ","alternatives":[],"source":"教科書","collocations":["寝たきりになる","寝たきりの生活","寝たきりの高齢者"]},{"id":7,"sentence":"（　）、眼鏡のまま顔を洗った","answer":"うっかり","reading":"","thai":"ไม่ระมัดระวัง, สะเพร่า, ลวก ๆ","alternatives":[],"source":"教科書","collocations":["うっかり忘れる","うっかり間違える","うっかり眼鏡のまま顔を洗う"]},{"id":8,"sentence":"女性が一人で（　）を歩くのは危険だ","answer":"夜道","reading":"よみち","thai":"ถนนยามค่ำคืน","alternatives":[],"source":"教科書","collocations":["夜道を歩く","暗い夜道","夜道に気をつける"]},{"id":9,"sentence":"現場の（　）を詳しく説明する","answer":"状況","reading":"じょうきょう","thai":"สถานการณ์, สภาพการณ์","alternatives":[],"source":"補足","collocations":["状況を考える","状況を説明する","状況を把握する"]},{"id":10,"sentence":"新技術の（　）には時間がかかる","answer":"実用化","reading":"じつようか","thai":"การทำให้ปฏิบัติได้จริง, การทำให้ใช้ได้จริง","alternatives":[],"source":"教科書","collocations":["実用化に時間がかかる","実用化を目指す","実用化に成功する"]},{"id":11,"sentence":"（　）の交流を深める","answer":"両国間","reading":"りょうこくかん","thai":"ระหว่างทั้งสองประเทศ","alternatives":[],"source":"補足","collocations":["両国間の交流","両国間の関係修復","両国間の協力"]},{"id":12,"sentence":"悪化した関係を（　）する","answer":"修復","reading":"しゅうふく","thai":"การซ่อมแซม, การแก้ไข","alternatives":[],"source":"教科書","collocations":["関係を修復する","建物を修復する","文化財を修復する"]},{"id":13,"sentence":"実現が（　）な目標に挑戦する","answer":"困難","reading":"こんなん","thai":"ยุ่งยาก, ยากลำบาก","alternatives":[],"source":"補足","collocations":["困難な課題","困難な状況","困難を乗り切る"]},{"id":14,"sentence":"食生活を（　）する","answer":"改善","reading":"かいぜん","thai":"การทำให้ดีขึ้น, การปรับปรุง","alternatives":[],"source":"教科書","collocations":["食生活を改善する","関係改善に向けて努力する","状況を改善する"]},{"id":15,"sentence":"母から（　）のセーターをもらう","answer":"手編み","reading":"てあみ","thai":"การถักด้วยมือ","alternatives":[],"source":"教科書","collocations":["手編みのセーター","手編みのマフラー","手編みの帽子"]},{"id":16,"sentence":"新製品が（　）になる","answer":"ヒット商品","reading":"ヒットしょうひん","thai":"สินค้ายอดนิยม","alternatives":[],"source":"教科書","collocations":["ヒット商品になる","ヒット商品が生まれる","ヒット商品を開発する"]},{"id":17,"sentence":"お祝いにバラの（　）を贈る","answer":"花束","reading":"はなたば","thai":"ช่อดอกไม้","alternatives":[],"source":"教科書","collocations":["バラの花束","花束を贈る","花束を受け取る"]},{"id":18,"sentence":"拍手で新入社員を（　）する","answer":"歓迎","reading":"かんげい","thai":"การต้อนรับ","alternatives":[],"source":"補足","collocations":["新入社員を歓迎する","歓迎メッセージ","心から歓迎する"]},{"id":19,"sentence":"卒業式で校歌を（　）する","answer":"合唱","reading":"がっしょう","thai":"การร้องประสานเสียง","alternatives":[],"source":"補足","collocations":["校歌を合唱する","合唱コンクール","合唱の練習"]},{"id":20,"sentence":"ピアノの（　）に出場する","answer":"コンクール","reading":"","thai":"การประกวด, การแข่งขัน","alternatives":[],"source":"補足","collocations":["ピアノコンクール","コンクールに出場する","合唱コンクールで優勝する"]},{"id":21,"sentence":"深い（　）に足を取られた","answer":"沼","reading":"ぬま","thai":"บึง","alternatives":[],"source":"補足","collocations":["深い沼","沼にはまる","沼の水"]},{"id":22,"sentence":"（　）の美容院で髪を切る","answer":"行きつけ","reading":"いきつけ","thai":"ไปเป็นประจำ","alternatives":[],"source":"教科書","collocations":["行きつけの美容院","行きつけの店","行きつけの病院"]},{"id":23,"sentence":"美容院が今月末に（　）する","answer":"閉店","reading":"へいてん","thai":"การปิดร้าน","alternatives":[],"source":"教科書","collocations":["美容院が閉店する","今月末に閉店する","閉店時間"]},{"id":24,"sentence":"わが社は（　）を導入している","answer":"フレックスタイム","reading":"","thai":"ระบบการทำงานแบบไม่กำหนดเวลาเข้าออกงานแต่จำนวนชั่วโมงทำงานต้องไม่ต่ำกว่าที่กำหนด","alternatives":[],"source":"補足","collocations":["フレックスタイム制度","フレックスタイムを導入する","フレックスタイムで働く"]},{"id":25,"sentence":"年金（　）を見直す","answer":"制度","reading":"せいど","thai":"ระบบ","alternatives":[],"source":"補足","collocations":["年金制度","制度を見直す","制度を導入する"]},{"id":26,"sentence":"希望の（　）で働ける","answer":"時間帯","reading":"じかんたい","thai":"ระยะเวลา, ช่วงเวลา","alternatives":[],"source":"教科書","collocations":["希望の時間帯","通勤時間帯","時間帯を選ぶ"]},{"id":27,"sentence":"（　）の最高気温は十度だ","answer":"日中","reading":"にっちゅう","thai":"ตอนกลางวัน","alternatives":[],"source":"教科書","collocations":["日中の最高気温","日中に働く","日中は暖かい"]},{"id":28,"sentence":"三月（　）に桜が咲き始める","answer":"下旬","reading":"げじゅん","thai":"ปลายเดือน, ช่วง 10 วันสุดท้ายของเดือน","alternatives":[],"source":"教科書","collocations":["三月下旬","今月下旬","下旬に発表する"]},{"id":29,"sentence":"大雪で飛行機が（　）する","answer":"欠航","reading":"けっこう","thai":"การยกเลิกเที่ยวบินหรือเรือ","alternatives":[],"source":"教科書","collocations":["飛行機が欠航する","大雪で欠航する","欠航が決まる"]},{"id":30,"sentence":"論文を書くため（　）を集める","answer":"参考資料","reading":"さんこうしりょう","thai":"ข้อมูลที่ใช้อ้างอิง","alternatives":[],"source":"補足","collocations":["参考資料が少ない","参考資料を集める","参考資料を読む"]}];
const DRAW=10, STORE_KEY='tryn2-colloc-deck-ch5', BLANK='（　）';
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// まだ出していない問の山（deck）。全問を出し切るまで同じ問は出ない。保存できない環境では毎回全問から選ぶ
function loadDeck(){try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(Array.isArray(d)&&d.every(i=>Number.isInteger(i)&&i>=0&&i<BANK.length))return [...new Set(d)]}catch(e){}return BANK.map((_,i)=>i)}
function saveDeck(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d))}catch(e){}}
// 山から先に取り、足りなければ山を全問で作り直して残りを補う（同じ10問の中では重複しない）
function draw(){
  const all=BANK.map((_,i)=>i), deck=loadDeck();
  const set=shuffle(deck.slice()).slice(0,DRAW);
  let next=deck.filter(i=>!set.includes(i));
  if(set.length<DRAW){
    set.push(...shuffle(all.filter(i=>!set.includes(i))).slice(0,DRAW-set.length));
    next=all.filter(i=>!set.includes(i));
  }
  saveDeck(next);
  return shuffle(set);
}
let current=[];
function render(){
  current=draw();
  qs('.questions').innerHTML=current.map((idx,n)=>{
    const q=BANK[idx], [before,after]=q.sentence.split(BLANK);
    const input=`（<input class="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第${n+1}問の答え">）`;
    return `<div class="question"><div class="q-text"><span class="q-num">${n+1}</span><span class="sentence">${esc(before)}${input}${esc(after)}</span></div><div class="hint" lang="th">〔${esc(q.thai)}〕</div><div class="explanation" aria-live="polite"></div></div>`;
  }).join('');
  qs('.print-key ol').innerHTML=current.map(idx=>`<li>${esc(BANK[idx].answer)}（${esc(BANK[idx].reading||'読みなし')}）</li>`).join('');
  qs('.score').textContent='　';
}
const isHiragana=s=>/^[ぁ-ゖー]+$/.test(s);
qs('.grade').addEventListener('click',()=>{
  let score=0;
  qsa('.question').forEach((row,n)=>{
    const item=BANK[current[n]], input=row.querySelector('.answer'), fb=row.querySelector('.explanation'), value=input.value.trim();
    let cls, mark;
    if(value===item.answer||item.alternatives.includes(value)){score+=1;cls='correct';mark='○'}
    else if(item.reading&&value===item.reading&&isHiragana(value)){score+=.5;cls='half';mark='△ 0.5'}
    else{cls='wrong';mark='×'}
    input.classList.remove('correct','half','wrong'); input.classList.add(cls);
    fb.className='explanation show '+cls;
    fb.innerHTML=`<span class="mark">${mark}</span>答え：<b>${esc(item.answer)}</b>（${esc(item.reading||'読みなし')}）`
      +(item.alternatives.length?`<div class="meta">別解：${item.alternatives.map(esc).join('／')}</div>`:'')
      +`<div class="meta">関連：${item.collocations.map(esc).join('／')}</div>`;
  });
  qs('.score').textContent=score;
});
qs('.next').addEventListener('click',()=>{render();window.scrollTo(0,0)});
render();
</script>
</body></html>
