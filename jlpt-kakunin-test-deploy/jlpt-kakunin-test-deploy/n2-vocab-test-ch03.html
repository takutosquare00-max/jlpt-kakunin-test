const DRAW=10, STORE_KEY='tryn2-colloc2-deck-ch03';
const qs=s=>document.querySelector(s), qsa=s=>[...document.querySelectorAll(s)];
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function conflicts(a,b){return CONFLICTS.some(p=>(p[0]===a&&p[1]===b)||(p[1]===a&&p[0]===b))}
function makeDeck(indices){for(let attempt=0;attempt<200;attempt++){let rest=shuffle(indices.slice()),out=[],ok=true;while(rest.length){let group=[],want=Math.min(DRAW,rest.length);for(let i=0;i<rest.length&&group.length<want;){if(group.some(j=>conflicts(rest[i],j))){i++;continue}group.push(rest.splice(i,1)[0])}if(group.length!==want){ok=false;break}out.push(...group)}if(ok)return out}return shuffle(indices.slice())}
function loadDeck(){try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(Array.isArray(d)&&d.every(i=>Number.isInteger(i)&&i>=0&&i<BANK.length))return [...new Set(d)]}catch(e){}return makeDeck(BANK.map((_,i)=>i))}
function saveDeck(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d))}catch(e){}}
function draw(){
  const all=BANK.map((_,i)=>i), deck=loadDeck(), picked=[];
  for(const i of deck) if(picked.length<DRAW&&!picked.some(j=>conflicts(i,j)))picked.push(i);
  const usedOutside=picked.length<DRAW;
  if(usedOutside) for(const i of shuffle(all.filter(i=>!deck.includes(i)))) if(picked.length<DRAW&&!picked.some(j=>conflicts(i,j)))picked.push(i);
  if(picked.length!==DRAW)throw Error('抽選できません');
  const remaining=deck.filter(i=>!picked.includes(i));
  saveDeck(usedOutside||remaining.length===0 ? makeDeck(all.filter(i=>!picked.includes(i))) : remaining);
  return shuffle(picked);
}
let current=[];
function render(){
  current=draw();
  qs('.questions').innerHTML=current.map((idx,n)=>{
    const q=BANK[idx]; const input=`（<input class="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="第${n+1}問の答え">）`;
    return `<div class="question"><div class="q-text"><span class="q-num">${n+1}</span><span class="sentence">${q.before}${input}${q.after}</span></div><div class="hint" lang="th">〔${esc(q.thai)}〕</div><div class="explanation" aria-live="polite"></div></div>`;
  }).join('');
  qs('.print-key ol').innerHTML=current.map(idx=>{const q=BANK[idx];return `<li>${esc(q.answer)}${q.answer!==q.reading?`（${esc(q.reading)}）`:''}</li>`}).join('');
  qs('.score').textContent='　';
}
